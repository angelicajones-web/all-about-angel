    <main class="container">

        <h1>Contact Me</h1>

        <!--
        This contact form uses Bootstrap form controls for a clean,
        responsive layout. The form includes text, email, phone,
        dropdown, radio button, checkbox, and message fields.
        -->

        <form class="contact-form">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>

                <input type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>

                <input type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>

                <input type="tel"
                    class="form-control"
                    id="phone"
                    name="phone"
                    pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                    placeholder="555-123-4567"
                    required>
            </div>

            <div class="mb-3">
                <label for="reason" class="form-label">Reason for Contact</label>

                <select class="form-select"
                    id="reason"
                    name="reason"
                    required>

                    <option value="">Choose one</option>
                    <option value="cybersecurity">Cybersecurity</option>
                    <option value="web-development">Web Development</option>
                    <option value="tech-support">Tech Support</option>
                    <option value="other">Other</option>

                </select>
            </div>

            <fieldset class="mb-3">

                <legend class="form-label">Preferred Contact Method</legend>

                <div class="form-check">

                    <input class="form-check-input"
                        type="radio"
                        name="contact-method"
                        id="contact-email"
                        value="email"
                        required>

                    <label class="form-check-label" for="contact-email">
                        Email
                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input"
                        type="radio"
                        name="contact-method"
                        id="contact-phone"
                        value="phone">

                    <label class="form-check-label" for="contact-phone">
                        Phone
                    </label>

                </div>

            </fieldset>

            <fieldset class="mb-3">

                <legend class="form-label">Areas of Interest</legend>

                <div class="form-check">

                    <input class="form-check-input"
                        type="checkbox"
                        id="interest-cybersecurity"
                        name="interests"
                        value="cybersecurity">

                    <label class="form-check-label" for="interest-cybersecurity">
                        Cybersecurity
                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input"
                        type="checkbox"
                        id="interest-web"
                        name="interests"
                        value="web-development">

                    <label class="form-check-label" for="interest-web">
                        Web Development
                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input"
                        type="checkbox"
                        id="interest-support"
                        name="interests"
                        value="tech-support">

                    <label class="form-check-label" for="interest-support">
                        Tech Support
                    </label>

                </div>

            </fieldset>

            <div class="mb-3">

                <label for="message" class="form-label">Message</label>

                <textarea class="form-control"
                    id="message"
                    name="message"
                    rows="5"
                    required></textarea>

            </div>

            <button type="submit" class="btn btn-primary">
                Submit
            </button>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
